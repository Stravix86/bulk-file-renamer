# Builds the Windows exe. Push a tag like v1.0.0 to publish it as a GitHub Release.
name: Build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop
      - run: node native/stage-web.mjs
      - run: npx --yes @tauri-apps/cli@2 build --no-bundle
        working-directory: native/desktop
      - run: Copy-Item native/desktop/target/release/bulk-file-renamer.exe BulkFileRenamer-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BulkFileRenamer-windows.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" BulkFileRenamer-windows.exe -R "$env:GITHUB_REPOSITORY" --title "Bulk File Renamer $env:GITHUB_REF_NAME" --generate-notes
